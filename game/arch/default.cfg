// QuakeHole default bindings and settings.
// Your own changes are saved to config.cfg in this folder and take priority.

unbindall

bind w			"+forward"
bind s			"+back"
bind a			"+moveleft"
bind d			"+moveright"
bind SPACE		"+jump"
bind CTRL		"+movedown"
bind c			"+movedown"
bind SHIFT		"+speed"
bind MOUSE1		"+attack"
bind MWHEELUP		"impulse 12"
bind MWHEELDOWN		"impulse 10"

bind 1			"impulse 1"
bind 2			"impulse 2"
bind 3			"impulse 3"
bind 4			"impulse 4"
bind 5			"impulse 5"
bind 6			"impulse 6"
bind 7			"impulse 7"
bind 8			"impulse 8"

bind f			"fly"
bind b			"arch_build"
bind r			"arch_snap"
bind h			"arch_help"

bind ESCAPE		"togglemenu"
bind `			"toggleconsole"
bind ~			"toggleconsole"
bind F12		"screenshot"

+mlook
cl_alwaysrun		"1"
crosshair		"1"
fov			"100"
sensitivity		"4"
